
services:

  # DATABASE MYSQL
  mysql:
    image: mysql:8.4.13
    container_name: kasir_mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_kasirku

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # BACKEND LARAVEL
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: kasir_backend
    restart: always

    working_dir: /var/www/html

    volumes:
      - ./backend:/var/www/html

    ports:
      - "8000:8000"

    depends_on:
      mysql:
        condition: service_healthy

  # FRONTEND REACT
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: kasir_frontend
    restart: always

    volumes:
      - ./frontend:/app
      - /app/node_modules

    ports:
      - "5173:5173"

    depends_on:
      - backend

volumes:
  mysql_data:
